[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-epistemic-harness"
version = "0.1.0"
description = "An evidence-first decision harness for software change assurance"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mosaic Contributors" }]
dependencies = []

[project.scripts]
mosaic = "mosaic_harness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mosaic_harness = ["templates/**/*"]
